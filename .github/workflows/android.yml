name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VIBEPIZZAIOLO_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: vosk-models-en-us-0.15-pl-0.22

      - name: Download speech models into the APK assets
        run: scripts/fetch_models.sh

      - name: Convert voice recordings from voice/
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          scripts/convert_voice.sh

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBEPIZZAIOLO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VIBEPIZZAIOLO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No VIBEPIZZAIOLO_KEYSTORE_BASE64 secret: the release APK is signed with the debug key."
          fi

      - name: Test the community server and start it for the app's client test
        run: |
          ./gradlew --no-daemon -p server test installDist
          DATA_DIR="$RUNNER_TEMP/pizzaioli" PORT=8089 server/build/install/pizzaioli-server/bin/pizzaioli-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8089/health && break; sleep 1; done
          echo "COMMUNITY_TEST_URL=http://localhost:8089" >> "$GITHUB_ENV"

      - name: Test, lint, build
        env:
          VIBEPIZZAIOLO_KEYSTORE_PASSWORD: ${{ secrets.VIBEPIZZAIOLO_KEYSTORE_PASSWORD }}
          VIBEPIZZAIOLO_KEY_ALIAS: ${{ secrets.VIBEPIZZAIOLO_KEY_ALIAS }}
          VIBEPIZZAIOLO_KEY_PASSWORD: ${{ secrets.VIBEPIZZAIOLO_KEY_PASSWORD }}
          # the community server's address, baked into the app; empty keeps the community on the phone
          VIBEPIZZAIOLO_COMMUNITY_URL: ${{ vars.VIBEPIZZAIOLO_COMMUNITY_URL }}
          # a Meta app id opens Instagram straight in its Reels editor; empty uses Instagram's share menu
          VIBEPIZZAIOLO_FB_APP_ID: ${{ vars.VIBEPIZZAIOLO_FB_APP_ID }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/vibepizzaiolo-$VIBEPIZZAIOLO_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/vibepizzaiolo-$VIBEPIZZAIOLO_VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/vibepizzaiolo.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vibepizzaiolo-${{ env.VIBEPIZZAIOLO_VERSION }}
          path: dist/vibepizzaiolo-*.apk
          if-no-files-found: error

      # Every push to the default branch replaces the "latest" pre-release,
      # so https://github.com/<owner>/<repo>/releases/download/latest/vibepizzaiolo.apk always has the newest build
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/vibepizzaiolo.apk "dist/vibepizzaiolo-$VIBEPIZZAIOLO_VERSION.apk" \
            --prerelease --target "$GITHUB_SHA" --title "VibePizzaiolo latest build ($VIBEPIZZAIOLO_VERSION)" \
            --notes "Newest build from ${GITHUB_SHA::7}. Download vibepizzaiolo.apk on your phone and open it to install."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vibepizzaiolo.apk "dist/vibepizzaiolo-$VIBEPIZZAIOLO_VERSION.apk" \
            --title "VibePizzaiolo $GITHUB_REF_NAME" --generate-notes
